name: q_slope_calculator
description: "An application which calculates Q-slope of a rock expressing the quality of the rock mass for slope stability."

publish_to: "none"

version: 1.2.0+16

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: 3.44.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_svg: ^2.0.10
  flutter_dotenv: ^6.0.1
  intl: ^0.20.2
  google_fonts: ^9.0.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.4
  collection: ^1.18.0
  flutter_bloc: ^9.1.1
  logger: ^2.4.0
  photo_view: ^0.15.0
  toastification: ^3.2.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.0
  responsive_framework: ^1.4.0
  uuid: ^4.6.0
  file_picker: ^13.1.0
  universal_html: ^2.3.0
  syncfusion_flutter_xlsio: ^35.1.40+1
  syncfusion_flutter_charts: ^35.1.40+1
  pdf: ^3.13.1
  printing: ^5.15.1
  geolocator: ^14.0.1
  image_picker: ^1.2.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  husky: ^0.1.7
  lint_staged: ^0.5.1
  msix: ^3.16.7

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/illustrations/
    - assets/images/
    - .env

msix_config:
  display_name: Q-slope Calculator
  publisher_display_name: Saarthak Gupta
  identity_name: in.sg.qslopecalculator
  msix_version: 1.2.0.0
  logo_path: assets/images/icon.png

lint_staged:
  "**/*.dart":
    - dart format
    - git add
    - dart analyze
