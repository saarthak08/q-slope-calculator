name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  test:
    name: Test and Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
          flutter-version-file: .fvmrc
          architecture: x64
      - run: flutter --version
      - run: cp .env.sample .env
        continue-on-error: true
      - run: flutter pub get
      - name: Analyze code
        run: flutter analyze
      - name: Ensure Dart code is formatted
        run: dart format -o none --set-exit-if-changed .
      - name: Run Flutter tests
        run: flutter test

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
          flutter-version-file: .fvmrc
          architecture: x64
      - name: Create .env file
        env:
          RELEASE_ENV: ${{ secrets.RELEASE_ENV }}
        run: echo -n "${RELEASE_ENV}" > .env
      - run: flutter pub get
      - name: Create release key properties
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PROPERTIES: ${{ secrets.RELEASE_KEYSTORE_PROPERTIES }}
        run: |
          mkdir -p android/keys
          echo -n "${RELEASE_KEYSTORE}" | base64 -d > android/keys/release.keystore
          echo "${RELEASE_KEYSTORE_PROPERTIES}" > android/keys/release-key.properties
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
      - name: Set Flavor
        run: |
          if [ "${{ github.ref }}" == "refs/heads/dev" ]; then
            echo "FLAVOR=dev" >> $GITHUB_ENV
            echo "FLAVOR_CAP=Dev" >> $GITHUB_ENV
          else
            echo "FLAVOR=prod" >> $GITHUB_ENV
            echo "FLAVOR_CAP=Prod" >> $GITHUB_ENV
          fi
      - name: Run build
        run: flutter build appbundle --release --flavor ${{ env.FLAVOR }}
      - name: Zip merged_native_libs
        run: |
          cd build/app/intermediates/merged_native_libs/${{ env.FLAVOR }}Release/merge${{ env.FLAVOR_CAP }}ReleaseNativeLibs/out/lib
          zip -r merged_native_libs.zip .
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: q-slope-calculator-android
          path: |
            build/app/outputs/bundle/${{ env.FLAVOR }}Release/app-${{ env.FLAVOR }}-release.aab
            build/app/outputs/mapping/${{ env.FLAVOR }}Release/mapping.txt
            build/app/intermediates/merged_native_libs/${{ env.FLAVOR }}Release/merge${{ env.FLAVOR_CAP }}ReleaseNativeLibs/out/lib/merged_native_libs.zip
          overwrite: true
          include-hidden-files: true

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
          flutter-version-file: .fvmrc
          architecture: x64
      - run: flutter pub get
      - name: Create .env file
        env:
          RELEASE_ENV: ${{ secrets.RELEASE_ENV }}
        run: echo -n "${RELEASE_ENV}" > .env
      - name: Build Web
        run: flutter build web --release --base-href="/q-slope-calculator/"
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web/
          overwrite: true
          include-hidden-files: true

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
          flutter-version-file: .fvmrc
          architecture: x64
      - run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: q-slope-calculator-windows
          path: build/windows/x64/runner/Release
          overwrite: true
          include-hidden-files: true

  deploy-playstore:
    name: Deploy to Play Store
    runs-on: ubuntu-latest
    needs: build-android
    environment: production
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: q-slope-calculator-android
          path: artifact
      - uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: in.sg.q_slope_calculator
          releaseFiles: artifact/outputs/bundle/prodRelease/app-prod-release.aab
          track: internal
          mappingFile: artifact/outputs/mapping/prodRelease/mapping.txt
          debugSymbols: artifact/intermediates/merged_native_libs/prodRelease/mergeProdReleaseNativeLibs/out/lib/merged_native_libs.zip

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: build-web
    environment: production
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: build/web
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

  create-release:
    name: Create Tag and Release
    runs-on: ubuntu-latest
    needs: [deploy-playstore, deploy-web, build-windows]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      - name: Get version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //; s/+.*//')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create tag
        run: |
          git tag ${{ steps.version.outputs.VERSION }}
          git push origin ${{ steps.version.outputs.VERSION }}
      - name: Create GitHub release
        run: |
          gh release create ${{ steps.version.outputs.VERSION }} \
            --title "Release ${{ steps.version.outputs.VERSION }}" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
